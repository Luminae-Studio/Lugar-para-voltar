<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lugar para Voltar — Fase 1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Cinzel:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Rajdhani',sans-serif;color:#fff;user-select:none;}
canvas{display:block;}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}

#hud{position:absolute;top:16px;left:16px;display:none;gap:24px;align-items:center;}
.hud-label{font-size:11px;letter-spacing:2px;color:#ff6b35;text-transform:uppercase;}
.hud-val{font-size:20px;font-weight:700;color:#fff;}
#health-bar-wrap{width:160px;height:10px;background:#300;border-radius:5px;border:1px solid #f00a;overflow:hidden;}
#health-bar{height:100%;background:linear-gradient(90deg,#f00,#f55);border-radius:5px;transition:width 0.2s;}
#wave-info{position:absolute;top:16px;right:16px;text-align:right;display:none;}
#wave-num{font-size:28px;font-weight:700;color:#fff;}

#screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:all;background:#06020f;}
#screen.hidden{display:none;}
.screen-title{font-family:'Cinzel',serif;font-size:clamp(28px,5vw,52px);color:#ff6b35;text-align:center;margin-bottom:8px;letter-spacing:4px;}
.screen-sub{font-size:clamp(13px,2vw,17px);color:#aaa;text-align:center;max-width:500px;line-height:1.8;margin-bottom:32px;padding:0 24px;}
.btn{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:14px 40px;border:2px solid #ff6b35;background:transparent;color:#ff6b35;cursor:pointer;transition:all 0.2s;border-radius:4px;pointer-events:all;}
.btn:hover{background:#ff6b35;color:#000;}

#controls-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;color:#444;letter-spacing:2px;text-transform:uppercase;display:none;pointer-events:none;white-space:nowrap;}
#message-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000d;border:1px solid #ff6b3544;border-radius:8px;padding:20px 32px;font-size:clamp(14px,2vw,18px);color:#fff;text-align:center;max-width:480px;line-height:1.7;pointer-events:none;display:none;font-family:'Cinzel',serif;}

#enigma-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:all;gap:18px;padding:24px;}
#enigma-overlay.active{display:flex;}
.enigma-door-title{font-family:'Creepster',cursive;font-size:clamp(20px,3.5vw,32px);color:#ff6b35;letter-spacing:3px;text-align:center;}
.enigma-story{font-size:clamp(13px,1.9vw,16px);color:#ddd;text-align:center;max-width:500px;line-height:1.9;font-style:italic;}
.enigma-question{font-size:clamp(13px,1.8vw,15px);color:#ff9966;text-align:center;max-width:420px;line-height:1.6;letter-spacing:1px;font-weight:600;}
.symbols-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.sym-btn{width:64px;height:64px;background:#854329;border:2px solid #ff6b3533;border-radius:10px;font-size:30px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;pointer-events:all;}
.sym-btn:hover{border-color:#ff6b35;background:#2a1000;transform:scale(1.1);}
.sym-btn.correct{border-color:#0f0;background:#0f02;}
.sym-btn.wrong{border-color:#f00;background:#f002;animation:shake 0.3s;}
.enigma-progress{display:flex;gap:12px;}
.prog-dot{width:14px;height:14px;border-radius:50%;background:#222;border:1px solid #444;transition:all 0.4s;}
.prog-dot.done{background:#ff6b35;border-color:#ff6b35;box-shadow:0 0 8px #ff6b3566;}
.enigma-feedback{font-size:14px;min-height:20px;text-align:center;letter-spacing:1px;}
.enigma-hint-text{font-size:12px;color:#ff6b3555;letter-spacing:1px;text-align:center;font-style:italic;}

#victory-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:#06020f;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:all;}
#victory-screen.active{display:flex;}
.victory-date{font-size:12px;letter-spacing:4px;color:#ff6b35;text-transform:uppercase;}
.victory-title{font-family:'Cinzel',serif;font-size:clamp(22px,4vw,40px);color:#fff;text-align:center;}
.victory-text{font-size:clamp(13px,1.8vw,16px);color:#ccc;text-align:center;max-width:460px;line-height:1.9;padding:0 24px;font-style:italic;}

#gameover-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;pointer-events:all;}
#gameover-screen.active{display:flex;}

@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp 0.7s ease forwards;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div style="display:flex;flex-direction:column;gap:3px;">
      <span class="hud-label">Vida</span>
      <div id="health-bar-wrap"><div id="health-bar" style="width:100%"></div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:3px;">
      <span class="hud-label">Pontos</span>
      <span class="hud-val" id="score-val">0</span>
    </div>
  </div>
  <div id="wave-info">
    <div class="hud-label">Onda</div>
    <div id="wave-num">1</div>
  </div>
  <div id="controls-hint">WASD — Mover &nbsp;|&nbsp; Mouse — Atirar &nbsp;|&nbsp; ESPAÇO — Espada &nbsp;|&nbsp; E — Magia</div>
  <div id="message-box"></div>

  <div id="enigma-overlay">
    <div class="enigma-door-title" id="enigma-door-title"></div>
    <div class="enigma-story" id="enigma-story"></div>
    <div class="enigma-question" id="enigma-question"></div>
    <div class="symbols-row" id="enigma-buttons"></div>
    <div class="enigma-hint-text" id="enigma-hint"></div>
    <div class="enigma-feedback" id="enigma-feedback"></div>
    <div class="enigma-progress" id="enigma-progress"></div>
  </div>

  <div id="victory-screen">
    <div class="victory-date fade-up">Outubro de 2023</div>
    <div class="victory-title fade-up">O Primeiro Encontro</div>
    <canvas id="anim-canvas" width="340" height="210" style="border:1.5px solid #ff6b3433;border-radius:10px;"></canvas>
    <div class="victory-text fade-up" id="victory-msg"></div>
    <button class="btn fade-up" id="next-phase-btn">Próxima Fase →</button>
  </div>

  <div id="gameover-screen">
    <div class="screen-title" style="font-size:36px;color:#f44">Você Caiu...</div>
    <div class="screen-sub">Os monstros foram fortes demais desta vez.<br>Mas a memória não some tão fácil.</div>
    <button class="btn" id="retry-btn">Tentar Novamente</button>
  </div>

  <div id="screen"><div id="screen-content"></div></div>
</div>

<script src="game-core.js"></script>
<script>
// ── CANVAS ──────────────────────────────────────────────────────────────────
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ── STATE ──────────────────────────────────────────────────────────────────
var waveNum = 1;
var MAX_WAVES = 3;

// ── PLAYER ──────────────────────────────────────────────────────────────────
var player = { x:0, y:0, r:18, speed:3.2, hp:100, maxHp:100, shootCd:0, shootRate:16, swordCd:0, magicCd:0, iframes:0 };

// ── GAME OBJECTS ──────────────────────────────────────────────────────────────
var bullets=[], enemies=[], swordSwings=[], magicOrbs=[];
var spawnTimer=0, toSpawn=[], waveCleared=false;

// ── HALLOWEEN DECOR ──────────────────────────────────────────────────────────
var bats = [];
for(var bi=0; bi<14; bi++) {
  bats.push({ x:Math.random()*1600, y:Math.random()*280+10, vx:(Math.random()*1.2+0.4)*(Math.random()<0.5?1:-1), wobble:Math.random()*Math.PI*2, size:Math.random()*6+5 });
}
var fog = [];
for(var fi=0; fi<55; fi++) {
  fog.push({ x:Math.random()*2400, y:Math.random()*700+100, r:Math.random()*70+30, a:Math.random()*0.055+0.015, sp:Math.random()*0.35+0.1 });
}
var pumpkins = [{x:.08,y:.86},{x:.22,y:.92},{x:.72,y:.89},{x:.91,y:.83},{x:.04,y:.52},{x:.96,y:.56},{x:.5,y:.97}];
var graves   = [{x:.14,y:.76},{x:.82,y:.73},{x:.48,y:.96}];
var webCorners = [{x:0,y:0,fx:1,fy:1},{x:1,y:0,fx:-1,fy:1},{x:0,y:.45,fx:1,fy:-1},{x:1,y:.42,fx:-1,fy:-1}];

// ── ENEMY TYPES ──────────────────────────────────────────────────────────────
var ETYPES = [
  {name:'ghost',   color:'#9966ff', r:15, hp:2,  speed:1.3, dmg:8,  score:10},
  {name:'zombie',  color:'#44bb44', r:20, hp:5,  speed:0.8, dmg:14, score:15},
  {name:'vampire', color:'#cc1133', r:17, hp:3,  speed:1.6, dmg:18, score:20},
  {name:'skull',   color:'#ddaa00', r:14, hp:2,  speed:2.1, dmg:12, score:15},
  {name:'boss',    color:'#ff2200', r:40, hp:40, speed:0.5, dmg:22, score:200},
];

function startWave(n) {
  waveNum = n;
  document.getElementById('wave-num').textContent = n;
  enemies=[]; bullets=[]; particles=[]; swordSwings=[]; magicOrbs=[];
  waveCleared=false; spawnTimer=0;
  if(n===MAX_WAVES) {
    toSpawn = [ETYPES[4]];
  } else {
    var c = 5+n*3; toSpawn=[];
    for(var i=0;i<c;i++){
      var r=Math.random();
      toSpawn.push(r<.25?ETYPES[3]:r<.5?ETYPES[2]:r<.75?ETYPES[1]:ETYPES[0]);
    }
  }
  if(n>1) showMessage(n===MAX_WAVES ? '💀 O CHEFE ACORDOU... CUIDADO!' : '⚡ ONDA '+n+' — MAIS SOMBRAS!', 2400);
}

function spawnEnemy(t) {
  var s=Math.floor(Math.random()*4), x, y;
  if(s===0){x=Math.random()*W;y=-50;}
  else if(s===1){x=W+50;y=Math.random()*H;}
  else if(s===2){x=Math.random()*W;y=H+50;}
  else{x=-50;y=Math.random()*H;}
  enemies.push({x:x,y:y,r:t.r,hp:t.hp,maxHp:t.hp,speed:t.speed,color:t.color,dmg:t.dmg,scoreVal:t.score,name:t.name,wobble:Math.random()*Math.PI*2,flashTimer:0});
}

function tryShoot() {
  if(player.shootCd>0) return;
  var dx=mouse.x-player.x, dy=mouse.y-player.y, l=Math.hypot(dx,dy)||1;
  bullets.push({x:player.x,y:player.y,vx:(dx/l)*11,vy:(dy/l)*11,r:6,life:65,color:'#ff9933'});
  player.shootCd=player.shootRate;
  playSound('shoot');
  burst(player.x,player.y,'#ff9933',3,2);
}

function swordAttack() {
  if(player.swordCd>0) return;
  player.swordCd=38; playSound('sword');
  var a=Math.atan2(mouse.y-player.y,mouse.x-player.x);
  swordSwings.push({x:player.x,y:player.y,angle:a,life:13,maxLife:13});
  for(var i=0;i<enemies.length;i++){
    if(Math.hypot(enemies[i].x-player.x,enemies[i].y-player.y)<95) hitEnemy(enemies[i],3);
  }
}

function magicAttack() {
  if(player.magicCd>0) return;
  player.magicCd=75; playSound('magic');
  var dx=mouse.x-player.x, dy=mouse.y-player.y, l=Math.hypot(dx,dy)||1;
  magicOrbs.push({x:player.x,y:player.y,vx:(dx/l)*6,vy:(dy/l)*6,r:14,life:90});
}

function hitEnemy(e, dmg) {
  e.hp-=dmg; e.flashTimer=6; playSound('hit');
  burst(e.x,e.y,e.color,5,3);
  if(e.hp<=0){
    score+=e.scoreVal;
    document.getElementById('score-val').textContent=score;
    playSound('die');
    burst(e.x,e.y,e.color,18,7);
    enemies.splice(enemies.indexOf(e),1);
  }
}

// ── MAIN LOOP ──────────────────────────────────────────────────────────────
var lastTime = 0;
function loop(ts) {
  var dt = Math.min((ts-lastTime)/16.67, 3); lastTime=ts;
  ctx.clearRect(0,0,W,H);
  if(gameState==='playing') updateGame(dt);
  drawBG();
  if(gameState==='playing') drawEntities();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function updateGame(dt) {
  var dx=0, dy=0;
  if(keys['KeyW']||keys['ArrowUp'])    dy--;
  if(keys['KeyS']||keys['ArrowDown'])  dy++;
  if(keys['KeyA']||keys['ArrowLeft'])  dx--;
  if(keys['KeyD']||keys['ArrowRight']) dx++;
  var l=Math.hypot(dx,dy)||1;
  if(dx||dy){ player.x+=(dx/l)*player.speed*dt; player.y+=(dy/l)*player.speed*dt; }
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));
  if(player.shootCd>0) player.shootCd-=dt;
  if(player.swordCd>0) player.swordCd-=dt;
  if(player.magicCd>0) player.magicCd-=dt;
  if(player.iframes>0) player.iframes-=dt;
  if(keys['Space']) swordAttack();
  if(keys['KeyE'])  magicAttack();
  if(mouse.down)    tryShoot();

  spawnTimer-=dt;
  if(spawnTimer<=0 && toSpawn.length>0){ spawnEnemy(toSpawn.shift()); spawnTimer=38; }

  bullets = bullets.filter(function(b){
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life<=0) return false;
    for(var i=enemies.length-1;i>=0;i--){
      if(Math.hypot(b.x-enemies[i].x,b.y-enemies[i].y)<b.r+enemies[i].r){ hitEnemy(enemies[i],1); return false; }
    }
    return b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30;
  });

  magicOrbs = magicOrbs.filter(function(orb){
    orb.life-=dt; if(orb.life<=0) return false;
    if(enemies.length>0){
      var cl=null, md=Infinity;
      enemies.forEach(function(e){ var d=Math.hypot(e.x-orb.x,e.y-orb.y); if(d<md){md=d;cl=e;} });
      if(cl){
        var ddx=cl.x-orb.x, ddy=cl.y-orb.y, dl=Math.hypot(ddx,ddy)||1;
        orb.vx+=(ddx/dl)*.45*dt; orb.vy+=(ddy/dl)*.45*dt;
        var sp=Math.hypot(orb.vx,orb.vy); if(sp>7){orb.vx=(orb.vx/sp)*7;orb.vy=(orb.vy/sp)*7;}
      }
    }
    orb.x+=orb.vx*dt; orb.y+=orb.vy*dt;
    for(var i=enemies.length-1;i>=0;i--){
      if(Math.hypot(orb.x-enemies[i].x,orb.y-enemies[i].y)<orb.r+enemies[i].r){
        hitEnemy(enemies[i],2); burst(orb.x,orb.y,'#aa44ff',8,4); return false;
      }
    }
    return true;
  });

  swordSwings = swordSwings.filter(function(s){ s.life-=dt; return s.life>0; });

  enemies.forEach(function(e){
    e.wobble+=.05*dt; if(e.flashTimer>0) e.flashTimer-=dt;
    var edx=player.x-e.x, edy=player.y-e.y, dist=Math.hypot(edx,edy);
    if(dist>e.r+player.r){ e.x+=(edx/dist)*e.speed*dt; e.y+=(edy/dist)*e.speed*dt; }
    else if(player.iframes<=0){ player.hp-=e.dmg*.04*dt; player.iframes=3; updateHealthBar(); if(player.hp<=0) triggerGameover(); }
  });

  particles = particles.filter(function(p){
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.93; p.vy*=.93; p.life-=dt; return p.life>0;
  });

  bats.forEach(function(b){ b.wobble+=.06*dt; b.x+=b.vx*dt; b.y+=Math.sin(b.wobble)*.5; if(b.x>W+50)b.x=-50; if(b.x<-50)b.x=W+50; });

  if(!waveCleared && toSpawn.length===0 && enemies.length===0){
    waveCleared=true;
    setTimeout(function(){
      if(waveNum<MAX_WAVES) startWave(waveNum+1);
      else triggerEnigma();
    }, 1500);
  }
}

// ── DRAW ──────────────────────────────────────────────────────────────────
function drawBG() {
  ctx.fillStyle='#06020f'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(80,30,120,0.06)'; ctx.lineWidth=1;
  for(var x=0;x<W;x+=90){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<H;y+=90){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  fog.forEach(function(p){ p.x-=p.sp; if(p.x+p.r<0)p.x=W+p.r; ctx.beginPath();ctx.arc(p.x,p.y%H,p.r,0,Math.PI*2);ctx.fillStyle='rgba(100,50,180,'+p.a+')';ctx.fill(); });

  webCorners.forEach(function(w){
    ctx.save(); ctx.translate(w.x*W,w.y*H); ctx.scale(w.fx,w.fy);
    ctx.strokeStyle='rgba(200,180,255,0.16)'; ctx.lineWidth=0.8;
    for(var i=0;i<8;i++){var a=i*(Math.PI/2)/7;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*120,Math.sin(a)*120);ctx.stroke();}
    for(var ri=1;ri<=5;ri++){ctx.beginPath();for(var i=0;i<=7;i++){var a=i*(Math.PI/2)/7,rd=ri*22;if(i===0)ctx.moveTo(Math.cos(a)*rd,Math.sin(a)*rd);else ctx.lineTo(Math.cos(a)*rd,Math.sin(a)*rd);}ctx.stroke();}
    ctx.restore();
  });

  graves.forEach(function(g){
    var gx=g.x*W, gy=g.y*H;
    ctx.fillStyle='#2a1a3a'; ctx.fillRect(gx-14,gy-44,28,44);
    ctx.beginPath(); ctx.arc(gx,gy-44,14,Math.PI,0); ctx.fill();
    ctx.fillStyle='#3d2a50'; ctx.font='bold 10px Rajdhani'; ctx.textAlign='center'; ctx.fillText('R.I.P',gx,gy-20);
    ctx.fillStyle='#1a0f26'; ctx.fillRect(gx-18,gy,36,8);
  });

  pumpkins.forEach(function(p){
    var px=p.x*W, py=p.y*H;
    ctx.fillStyle='#c25000'; ctx.beginPath(); ctx.arc(px,py,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#a84400'; ctx.beginPath(); ctx.arc(px-7,py,10,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(px+7,py,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#220d00'; ctx.fillRect(px-10,py-5,6,5); ctx.fillRect(px+4,py-5,6,5);
    ctx.fillRect(px-9,py+4,5,4); ctx.fillRect(px-2,py+4,5,4); ctx.fillRect(px+6,py+4,5,4);
    ctx.fillStyle='#226600'; ctx.fillRect(px-2,py-17,4,9);
    ctx.beginPath(); ctx.arc(px,py,20,0,Math.PI*2); ctx.fillStyle='rgba(255,110,0,0.07)'; ctx.fill();
  });

  if(gameState==='playing' || gameState==='enigma') {
    bats.forEach(function(b){
      ctx.save(); ctx.translate(b.x,b.y);
      var flap=Math.sin(b.wobble*3)*.35;
      ctx.fillStyle='rgba(70,35,110,0.75)';
      ctx.beginPath(); ctx.ellipse(0,0,b.size*.5,b.size*.4,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-b.size*1.4,-b.size*(1+flap),-b.size*2.4,-b.size*.3,-b.size*2.1,b.size*.3); ctx.bezierCurveTo(-b.size*1.4,b.size*.1,0,b.size*.2,0,0); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(b.size*1.4,-b.size*(1+flap),b.size*2.4,-b.size*.3,b.size*2.1,b.size*.3); ctx.bezierCurveTo(b.size*1.4,b.size*.1,0,b.size*.2,0,0); ctx.fill();
      ctx.restore();
    });
  }
}

function drawEntities() {
  particles.forEach(function(p){
    var a=p.life/p.maxLife;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*a,0,Math.PI*2);
    ctx.fillStyle=p.color+Math.floor(a*255).toString(16).padStart(2,'0'); ctx.fill();
  });

  magicOrbs.forEach(function(o){
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r*1.7,0,Math.PI*2); ctx.fillStyle='rgba(170,68,255,0.1)'; ctx.fill();
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fillStyle='#cc88ff'; ctx.fill();
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r*.4,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  });

  bullets.forEach(function(b){
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fillStyle=b.color; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*.4,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  });

  swordSwings.forEach(function(s){
    var t=s.life/s.maxLife;
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.angle); ctx.globalAlpha=t;
    ctx.strokeStyle='#ffdd44'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(12,-32); ctx.lineTo(90,0); ctx.lineTo(12,32); ctx.stroke();
    ctx.globalAlpha=t*.25; ctx.fillStyle='#ffdd44';
    ctx.beginPath(); ctx.moveTo(12,-32); ctx.lineTo(90,0); ctx.lineTo(12,32); ctx.closePath(); ctx.fill();
    ctx.restore();
  });

  enemies.forEach(function(e){
    ctx.save(); ctx.translate(e.x,e.y+Math.sin(e.wobble)*3);
    if(e.flashTimer>0) ctx.globalAlpha=.4;
    var c=e.flashTimer>0?'#fff':e.color;
    if(e.name==='boss'){
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,-6,e.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(-14,-12,9,10,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(14,-12,9,10,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=c; ctx.fillRect(-e.r*.75,e.r*.15,e.r*1.5,e.r*.65);
      ctx.fillStyle='#000'; for(var i=-2;i<=2;i++) ctx.fillRect(i*10-3,e.r*.35,6,e.r*.4);
      ctx.fillStyle='#ffdd00'; ctx.beginPath(); ctx.moveTo(-e.r,-e.r); ctx.lineTo(-e.r,-e.r-18); ctx.lineTo(-e.r*.4,-e.r-9); ctx.lineTo(0,-e.r-22); ctx.lineTo(e.r*.4,-e.r-9); ctx.lineTo(e.r,-e.r-18); ctx.lineTo(e.r,-e.r); ctx.closePath(); ctx.fill();
    } else if(e.name==='ghost'){
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,-e.r*.2,e.r,Math.PI,0); ctx.lineTo(e.r,e.r*.8); ctx.bezierCurveTo(e.r*.5,e.r*.4,e.r*.15,e.r,0,e.r*.7); ctx.bezierCurveTo(-e.r*.15,e.r,-e.r*.5,e.r*.4,-e.r,e.r*.8); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#2200aa'; ctx.beginPath(); ctx.ellipse(-e.r*.35,-e.r*.1,4,5,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(e.r*.35,-e.r*.1,4,5,0,0,Math.PI*2); ctx.fill();
    } else if(e.name==='vampire'){
      ctx.fillStyle='#330011'; ctx.beginPath(); ctx.moveTo(-e.r,0); ctx.lineTo(-e.r*1.9,e.r*1.6); ctx.lineTo(0,e.r*.5); ctx.lineTo(e.r*1.9,e.r*1.6); ctx.lineTo(e.r,0); ctx.closePath(); ctx.fill();
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(-e.r*.35,-e.r*.25,3,4,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(e.r*.35,-e.r*.25,3,4,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#cc0000'; ctx.fillRect(-e.r*.6,e.r*.2,e.r*1.2,4);
      ctx.fillStyle='#fff'; ctx.fillRect(-e.r*.1,e.r*.15,4,8); ctx.fillRect(e.r*.07,e.r*.15,4,8);
    } else if(e.name==='skull'){
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,-3,e.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(-5,-5,5,6,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(5,-5,5,6,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=c; ctx.fillRect(-e.r*.65,e.r*.25,e.r*1.3,e.r*.55);
      ctx.fillStyle='#000'; for(var i=-1;i<=1;i++) ctx.fillRect(i*7-2,e.r*.3,4,e.r*.45);
    } else {
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    var bw=e.r*2.4;
    ctx.fillStyle='#300'; ctx.fillRect(-bw/2,-e.r-14,bw,5);
    ctx.fillStyle='#f44'; ctx.fillRect(-bw/2,-e.r-14,bw*(e.hp/e.maxHp),5);
    ctx.restore();
  });

  var angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);
  ctx.save(); ctx.translate(player.x,player.y);
  ctx.beginPath(); ctx.arc(0,0,player.r+8,0,Math.PI*2); ctx.fillStyle='rgba(255,107,53,0.12)'; ctx.fill();
  ctx.fillStyle=player.iframes>0?'rgba(255,255,255,0.55)':'#ff6b35'; ctx.beginPath(); ctx.arc(0,0,player.r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(Math.cos(angle)*player.r*.52,Math.sin(angle)*player.r*.52,5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#ffcc88'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(Math.cos(angle)*player.r,Math.sin(angle)*player.r); ctx.lineTo(Math.cos(angle)*(player.r+18),Math.sin(angle)*(player.r+18)); ctx.stroke();
  ctx.restore();

  ctx.strokeStyle='rgba(255,107,53,0.75)'; ctx.lineWidth=1.5;
  var cs=10;
  ctx.beginPath(); ctx.moveTo(mouse.x-cs,mouse.y); ctx.lineTo(mouse.x+cs,mouse.y); ctx.moveTo(mouse.x,mouse.y-cs); ctx.lineTo(mouse.x,mouse.y+cs); ctx.stroke();
  ctx.beginPath(); ctx.arc(mouse.x,mouse.y,4,0,Math.PI*2); ctx.stroke();
}

// ── CUTSCENES ──────────────────────────────────────────────────────────────
function startIntro(){
  startHalloweenCutscene();
}

function startHalloweenCutscene(){
  gameState='halloween_intro';
  showScreen('<div style="text-align:center;padding:0 24px;max-width:520px;">'
    +'<div style="font-size:11px;letter-spacing:4px;color:#ff6b35;margin-bottom:18px;text-transform:uppercase">Outubro de 2023</div>'
    +'<div class="screen-title" style="font-family:Creepster,cursive;font-size:clamp(24px,4vw,46px);color:#ff6b35;margin-bottom:16px">Halloween</div>'
    +'<div class="screen-sub" style="margin-bottom:10px">Matheus se viu de repente no meio de uma boate abandonada.<br>Fumaça por todo lado. Luzes piscando. Fantasias por todo canto.<br><br>E então — ele a viu.</div>'
    +'<div style="font-size:14px;color:#ff9966;letter-spacing:1px;margin-bottom:10px;font-style:italic">No meio da pista, ela brilhava de um jeito diferente.</div>'
    +'<div style="font-size:13px;color:#aa4422;margin-bottom:26px">Mas antes que ele pudesse chegar perto,<br>as sombras começaram a se mover...</div>'
    +'<button class="btn" onclick="startPlaying()">⚔ Lutar ›</button>'
    +'</div>');
}

function startPlaying(){
  hideScreen(); gameState='playing';
  player.x=W/2; player.y=H/2; player.hp=player.maxHp;
  score=0; document.getElementById('score-val').textContent='0';
  document.getElementById('hud').style.display='flex';
  document.getElementById('wave-info').style.display='block';
  document.getElementById('controls-hint').style.display='block';
  updateHealthBar(); startWave(1);
  showMessage('👻 ONDA 1 — AS SOMBRAS CHEGAM!',2400);
}

// ── ENIGMA ──────────────────────────────────────────────────────────────────
var ENIGMAS = [
  {
    door:'🚪 Porta 1 de 3',
    story:'Entre as luzes da casa assombrada e a música de fundo, se encontraram dois pares de olhos. Depois de um cumprimento e um sorriso, ele ofereceu...',
    question:'O que ele ofereceu naquele primeiro momento?',
    options:['🍺','🥤','🍹','🧃','🍷','🥂'],
    answer:'🍹',
    hint:'Era algo especial, feito para aquela noite...'
  },
  {
    door:'🚪 Porta 2 de 3',
    story:'A noite passou junto com danças e risos. E do nada surgiu uma nova língua, uma nova conexão — e a descoberta de que estudavam na mesma faculdade.',
    question:'Qual a bandeira do idioma que descobriram compartilhar?',
    options:['br','gb','fr','us','ar','de'],
    answer:'us',
    hint:'A língua que o mundo fala...',
    imgPrefix:'https://flagcdn.com/w40/'
  },
  {
    door:'🚪 Porta 3 de 3',
    story:'A noite terminou no começo de um outro dia. Separados por outros caminhos, mas nela ficou gravado algo que iluminou mais do que qualquer luz da festa...',
    question:'O que ficou guardado para sempre naquela memória?',
    options:['💋','✨','🌙','😁','💫','🌹'],
    answer:'😁',
    hint:'Algo que iluminou mais do que qualquer luz da festa...'
  }
];

var currentEnigma = 0;

function triggerEnigma(){
  gameState='enigma';
  document.getElementById('hud').style.display='none';
  document.getElementById('wave-info').style.display='none';
  document.getElementById('controls-hint').style.display='none';
  showMessage('A saída está trancada...<br>Três portas bloqueiam o caminho!', 2400);
  setTimeout(function(){ openEnigma(0); }, 2400);
}

function openEnigma(idx){
  currentEnigma=idx;
  var e=ENIGMAS[idx];
  document.getElementById('enigma-door-title').textContent=e.door;
  document.getElementById('enigma-story').textContent=e.story;
  document.getElementById('enigma-question').textContent=e.question;
  document.getElementById('enigma-hint').textContent='✦ Dica: '+e.hint;
  document.getElementById('enigma-feedback').textContent='';
  var prog=document.getElementById('enigma-progress');
  var dots=''; for(var i=0;i<ENIGMAS.length;i++) dots+='<div class="prog-dot'+(i<idx?' done':'')+'"></div>';
  prog.innerHTML=dots;
  var opts=e.options.slice().sort(function(){return Math.random()-.5;});
  var btns=''; opts.forEach(function(sym){ var inner=e.imgPrefix?('<img src="'+e.imgPrefix+sym+'.png" style="width:40px;height:auto;display:block;border-radius:3px;" alt="'+sym+'">'):sym; btns+='<button class="sym-btn" data-sym="'+sym+'" onclick="selectEnigmaAnswer(\''+sym+'\')">'+inner+'</button>'; });
  document.getElementById('enigma-buttons').innerHTML=btns;
  document.getElementById('enigma-overlay').classList.add('active');
}

function selectEnigmaAnswer(sym){
  var e=ENIGMAS[currentEnigma];
  var feedback=document.getElementById('enigma-feedback');
  var btns=document.querySelectorAll('.sym-btn');
  var btn=null;
  btns.forEach(function(b){ if(b.getAttribute('data-sym')===sym) btn=b; });
  if(sym===e.answer){
    playSound('enigma_ok');
    if(btn) btn.classList.add('correct');
    feedback.style.color='#0f0'; feedback.textContent='✓ Correto! A porta se abre...';
    var dots=document.querySelectorAll('.prog-dot');
    if(dots[currentEnigma]) dots[currentEnigma].classList.add('done');
    setTimeout(function(){
      if(currentEnigma<ENIGMAS.length-1){ openEnigma(currentEnigma+1); }
      else{ document.getElementById('enigma-overlay').classList.remove('active'); triggerVictory(); }
    }, 1100);
  } else {
    playSound('enigma_fail');
    if(btn){ btn.classList.add('wrong'); setTimeout(function(){btn.classList.remove('wrong');},600); }
    feedback.style.color='#f55'; feedback.textContent='✗ Não é esse... tente de novo.';
    setTimeout(function(){ feedback.textContent=''; }, 900);
  }
}

// ── VICTORY ──────────────────────────────────────────────────────────────────
function triggerVictory(){
  gameState='victory'; playSound('victory');
  document.getElementById('victory-screen').classList.add('active');
  document.getElementById('victory-msg').innerHTML='Entre fumaça e música, no meio do caos do Halloween,<br>ele a viu pela primeira vez.<br><br>E algo dentro dele soube:<br><em style="color:#ff9966">essa não era uma noite qualquer.</em>';
  runVictoryAnim();
}

function runVictoryAnim(){
  var ac=document.getElementById('anim-canvas');
  var a=ac.getContext('2d');
  var t=0;
  var hearts=[];
  for(var i=0;i<14;i++) hearts.push({x:Math.random()*340,y:220+Math.random()*60,vy:-(Math.random()*1.1+.4),vx:(Math.random()-.5)*.6,alpha:.7+Math.random()*.3,sz:Math.random()*10+5});

  function hrt(ctx,x,y,sz,al){
    ctx.save(); ctx.globalAlpha=al; ctx.fillStyle='#ff4466';
    ctx.translate(x,y); ctx.scale(sz/10,sz/10);
    ctx.beginPath(); ctx.moveTo(0,-3);
    ctx.bezierCurveTo(5,-8,10,-4,0,5); ctx.bezierCurveTo(-10,-4,-5,-8,0,-3);
    ctx.fill(); ctx.restore();
  }

  function frame(){
    if(gameState!=='victory') return;
    t++;
    a.clearRect(0,0,340,210); a.fillStyle='#0d0520'; a.fillRect(0,0,340,210);
    for(var i=0;i<5;i++){
      var cx=34+i*68, hue=t*2+i*40;
      a.beginPath(); a.moveTo(cx,210);
      a.arc(cx,210,160,-0.38+Math.sin(t*.03+i)*.28,-0.02+Math.sin(t*.03+i)*.28);
      a.fillStyle='hsla('+hue+',80%,60%,0.07)'; a.fill();
    }
    var lx=118+Math.sin(t*.03)*4, rx=202+Math.sin(t*.03+1)*4;
    a.fillStyle='#ff6b35'; a.beginPath(); a.arc(lx,130,14,0,Math.PI*2); a.fill(); a.fillRect(lx-10,143,20,32);
    a.fillStyle='#744D64'; a.beginPath(); a.arc(rx,130,14,0,Math.PI*2); a.fill();
    a.beginPath(); a.moveTo(rx-13,143); a.lineTo(rx+13,143); a.lineTo(rx+16,175); a.lineTo(rx-16,175); a.closePath(); a.fill();
    var p=Math.min(1,(t-20)/40);
    if(p>0){
      a.strokeStyle='rgba(255,220,100,'+(p*.5)+')'; a.lineWidth=1.5; a.setLineDash([4,4]);
      a.beginPath(); a.moveTo(lx+14,130); a.lineTo(rx-14,130); a.stroke(); a.setLineDash([]);
    }
    hearts.forEach(function(h){ h.y+=h.vy; h.x+=h.vx; h.alpha-=.003; if(h.y<-20||h.alpha<=0){h.y=230;h.x=Math.random()*340;h.alpha=.6+Math.random()*.3;} hrt(a,h.x,h.y,h.sz,h.alpha); });
    if(t>55){ a.globalAlpha=Math.min(1,(t-55)/30); a.fillStyle='#ff9966'; a.font='bold 12px Rajdhani'; a.textAlign='center'; a.fillText('Outubro 2023 — O primeiro encontro',170,195); a.globalAlpha=1; }
    requestAnimationFrame(frame);
  }
  frame();
}

document.getElementById('next-phase-btn').addEventListener('click', function(){
  window.location.href='fase2-carnaval.html';
});

document.getElementById('retry-btn').addEventListener('click', function(){
  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('hud').style.display='none';
  document.getElementById('wave-info').style.display='none';
  document.getElementById('controls-hint').style.display='none';
  startIntro();
});

function triggerGameover(){
  gameState='gameover'; player.hp=0; updateHealthBar();
  document.getElementById('gameover-screen').classList.add('active');
}

startIntro();
</script>
